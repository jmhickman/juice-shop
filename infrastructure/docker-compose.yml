# vuln-code-snippet start vulnerableDockerImageChallenge
services:
  nginx:
    image: nginx:1.28.0-alpine
    container_name: lollo-logistics-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lollo-logistics
    networks:
      - lollo-logistics-net

  lollo-logistics:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile
    image: lollo-logistics:latest
    container_name: lollo-logistics-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - lollo-logistics-data:/lollo-logistics/data/sqlite
    networks:
      - lollo-logistics-net
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7.4.4-alpine
    container_name: lollo-logistics-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    expose:
      - "6379"
    networks:
      - lollo-logistics-net

  mongo:
    image: mongo:4.4.29 # vuln-code-snippet vuln-line vulnerableDockerImageChallenge
    container_name: lollo-logistics-mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      MONGO_INITDB_DATABASE: juiceshop
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - lollo-logistics-net

volumes:
  lollo-logistics-data:
    driver: local
  mongo-data:
    driver: local

networks:
  lollo-logistics-net:
    driver: bridge
# vuln-code-snippet end vulnerableDockerImageChallenge
